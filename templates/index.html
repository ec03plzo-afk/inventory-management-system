<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #fafafa; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin-top: 20px; }
        input { padding: 8px; margin-right: 10px; }
        .btn-add { padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-edit { padding: 6px 12px; background-color: #ffc107; color: black; text-decoration: none; border-radius: 4px; margin-right: 5px; font-size: 14px; }
        .btn-delete { padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .actions { display: flex; align-items: center; }
        .logout-btn { color: #dc3545; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Inventory System</h1>
        <div>
            <span>Welcome, <strong>{{ session['username'] }}</strong>!</span> | 
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
        {% for row in inventory %}
        <tr>
            <td>{{ row['id'] }}</td>
            <td>{{ row['item'] }}</td>
            <td>{{ row['quantity'] }}</td>
            <td>
                <div class="actions">
                    <a href="/edit/{{ row['id'] }}" class="btn-edit">Edit</a>
                    <form action="/delete/{{ row['id'] }}" method="POST" style="margin:0;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this item?')">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
    </table>

    <h2>Add New Item</h2>
    <form action="/add" method="POST">
        <input type="text" name="item" placeholder="Item Name" required>
        <input type="number" name="quantity" placeholder="Quantity" required>
        <button type="submit" class="btn-add">Add Item</button>
    </form>
</body>
</html>
